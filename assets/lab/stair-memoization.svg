<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
  <title id="title">Top-down stair memoization</title>
  <desc id="desc">A small diagram showing f(n) reusing memoized f(n-1) and f(n-2).</desc>
  <rect width="420" height="150" rx="12" fill="#eef4ff"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="18" fill="#17233c">
    <rect x="155" y="18" width="110" height="38" rx="8" fill="#b9d4ff"/>
    <text x="210" y="43">f(n)</text>
    <rect x="45" y="94" width="110" height="38" rx="8" fill="#c8efd5"/>
    <text x="100" y="119">f(n-1)</text>
    <rect x="265" y="94" width="110" height="38" rx="8" fill="#c8efd5"/>
    <text x="320" y="119">f(n-2)</text>
  </g>
  <path d="M185 56 L115 94 M235 56 L305 94" stroke="#315a9b" stroke-width="3" fill="none"/>
</svg>
